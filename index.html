<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#211d2b">
<title>HIT ME! — 친구 전용 샌드백</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@600;700;800;900&display=swap');
:root{--bg:#211d2b;--panel:#302a3b;--panel2:#3b3348;--pink:#ff8fb1;--cream:#fff3df;--muted:#c7b9d1;--yellow:#ffd66e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#49334f 0,#211d2b 55%);color:var(--cream);font-family:'Jua',sans-serif;padding:22px 14px 40px}
button{font:inherit;cursor:pointer}
.wrap{width:min(900px,100%);margin:auto}
header{text-align:center;margin:8px 0 20px}
.kicker{font:800 11px Nunito,sans-serif;letter-spacing:3px;color:var(--pink)}
h1{font-size:clamp(42px,10vw,68px);line-height:1;margin:8px 0;color:#fff;text-shadow:4px 4px 0 #a94e78}
.subtitle{color:var(--muted);font-size:15px}
.panel{background:rgba(48,42,59,.94);border:1px solid #574a65;border-radius:24px;padding:18px;box-shadow:0 14px 35px #100d1680}
.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:16px}
.stage{position:relative;min-height:470px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(180deg,#49364e,#332c40);border-radius:20px}
.stage:after{content:"";position:absolute;bottom:27px;width:190px;height:22px;border-radius:50%;background:#17131d88;filter:blur(5px)}
.char{position:relative;z-index:2;width:245px;height:365px;transition:transform .12s}
.char.hit{animation:bump .24s ease}
@keyframes bump{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(-9px) rotate(-4deg)}55%{transform:translateX(8px) rotate(4deg)}100%{transform:translateX(0) rotate(0)}}
.part{cursor:pointer;outline:none}
.part:hover{filter:brightness(1.12)}
.part:focus{stroke:#fff;stroke-width:3}
.hitword{position:absolute;z-index:5;font:900 30px Nunito,sans-serif;color:var(--yellow);text-shadow:2px 3px #7c3c55;pointer-events:none;animation:pop .65s ease forwards}
@keyframes pop{0%{opacity:0;transform:scale(.4) rotate(-15deg)}20%{opacity:1;transform:scale(1.2) rotate(8deg)}100%{opacity:0;transform:translateY(-65px) scale(.8)}}
.hint{position:absolute;bottom:12px;z-index:3;color:#e7d8e8;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:#241f2e;border-radius:15px;padding:12px 8px;text-align:center}
.stat strong{display:block;font:900 25px Nunito,sans-serif;color:var(--yellow)}
.stat span{font-size:12px;color:var(--muted)}
.section-title{font-size:18px;margin:17px 0 10px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tool{border:1px solid #65566f;background:#40374b;color:var(--cream);border-radius:13px;padding:10px 4px;font-size:13px}
.tool b{display:block;font-size:24px;margin-bottom:3px}
.tool.active{background:#75445f;border:2px solid var(--pink);padding:9px 3px;box-shadow:0 0 0 2px #ff8fb133}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.zone{background:#40374b;color:var(--cream);border:1px solid #65566f;border-radius:12px;padding:10px 5px;font-size:13px}
.zone:active,.tool:active,.reset:active{transform:scale(.97)}
.actions{display:flex;gap:8px;margin-top:14px}
.reset{flex:1;border:0;border-radius:13px;background:#594b63;color:white;padding:12px}
.sound{border:1px solid #65566f;border-radius:13px;background:#40374b;color:white;padding:12px}
.note{color:#bcaec7;font-size:11px;line-height:1.6;margin:14px 2px 0}
.login{position:fixed;inset:0;background:#17131df2;z-index:20;display:grid;place-items:center;padding:20px}
.login-card{width:min(390px,100%);background:#302a3b;border:1px solid #68536e;border-radius:24px;padding:28px;text-align:center;box-shadow:0 20px 80px #0009}
.lock{font-size:44px}
.login h2{font-size:27px;margin:8px 0}
.login p{color:var(--muted);font-size:13px;line-height:1.5}
.login input{width:100%;padding:14px;border-radius:12px;border:1px solid #76627e;background:#211d2b;color:white;font:16px Nunito,sans-serif;text-align:center;margin:10px 0}
.enter{width:100%;border:0;border-radius:12px;padding:14px;background:var(--pink);color:#382333;font-size:17px}
.error{color:#ff9b9b;min-height:20px;font-size:12px}
@media(max-width:680px){.grid{grid-template-columns:1fr}.stage{min-height:410px}.char{height:335px;width:225px}.panel{padding:13px}.stats{margin-bottom:10px}.right{padding-top:14px}}
</style>
</head>
<body>
<div class="login" id="login">
  <div class="login-card">
    <div class="lock">🔒</div><h2>친구 전용 HIT ME!</h2>
    <p>입장 암호를 입력해 주세요.<br>허락받은 친구만 들어올 수 있어요.</p>
    <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button class="enter" id="enter">입장하기</button>
    <div class="error" id="error"></div>
  </div>
</div>
<div class="wrap">
<header><div class="kicker">PRIVATE SANDBAG CLICKER</div><h1>HIT ME!</h1><div class="subtitle">오늘의 스트레스, 화면 속 샌드백에게 털어놓기 💥</div></header>
<div class="grid">
  <section class="panel stage" id="stage">
    <svg class="char" id="character" viewBox="0 0 240 360" role="img" aria-label="귀여운 SD 캐릭터">
      <!-- hair behind -->
      <ellipse cx="120" cy="83" rx="61" ry="68" fill="#493044"/>
      <!-- ears -->
      <ellipse cx="61" cy="111" rx="13" ry="19" fill="#ffc6ad"/><ellipse cx="179" cy="111" rx="13" ry="19" fill="#ffc6ad"/>
      <!-- head -->
      <ellipse class="part" data-part="얼굴" cx="120" cy="105" rx="57" ry="65" fill="#ffd2b9" stroke="#e9a98f" stroke-width="2"/>
      <!-- hair cap -->
      <path d="M65 103 Q53 24 120 30 Q190 25 176 106 Q158 72 142 65 Q120 88 91 66 Q80 92 65 103" fill="#493044"/>
      <!-- bangs -->
      <path d="M70 82 Q95 97 111 70 Q126 96 151 70 Q165 83 174 98 Q143 87 121 101 Q95 87 70 100Z" fill="#493044"/>
      <!-- face details -->
      <ellipse cx="99" cy="116" rx="5" ry="8" fill="#493044"/><ellipse cx="142" cy="116" rx="5" ry="8" fill="#493044"/>
      <path d="M112 139 Q120 146 128 139" fill="none" stroke="#bd6c79" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="85" cy="132" rx="10" ry="5" fill="#f59b9e" opacity=".7"/><ellipse cx="155" cy="132" rx="10" ry="5" fill="#f59b9e" opacity=".7"/>
      <!-- neck -->
      <rect x="108" y="159" width="24" height="25" rx="9" fill="#ffc6ad"/>
      <!-- body -->
      <path class="part" data-part="몸통" d="M79 178 Q120 163 161 178 L174 270 Q120 291 66 270Z" fill="#ff8fb1" stroke="#e66c98" stroke-width="2"/>
      <!-- arms -->
      <path class="part" data-part="팔" d="M78 184 Q54 194 48 234 Q44 251 59 253 Q73 253 76 237 L96 202Z" fill="#ffd2b9" stroke="#e9a98f" stroke-width="2"/>
      <path class="part" data-part="팔" d="M162 184 Q186 194 192 234 Q196 251 181 253 Q167 253 164 237 L144 202Z" fill="#ffd2b9" stroke="#e9a98f" stroke-width="2"/>
      <!-- legs -->
      <path class="part" data-part="다리" d="M75 264 Q94 275 116 270 L113 326 Q109 340 91 338 Q78 336 79 322Z" fill="#6f719f" stroke="#515477" stroke-width="2"/>
      <path class="part" data-part="다리" d="M124 270 Q148 275 165 264 L161 322 Q162 336 145 338 Q127 340 127 326Z" fill="#6f719f" stroke="#515477" stroke-width="2"/>
      <!-- shoes -->
      <ellipse cx="94" cy="337" rx="25" ry="11" fill="#fff0d9"/><ellipse cx="147" cy="337" rx="25" ry="11" fill="#fff0d9"/>
      <path d="M78 335h32M132 335h31" stroke="#d6a9aa" stroke-width="3" stroke-linecap="round"/>
      <text x="120" y="222" text-anchor="middle" font-size="18" fill="#fff4e9">★</text>
    </svg>
    <div class="hint">캐릭터의 부위를 눌러도 타격 가능!</div>
  </section>
  <section class="panel right">
    <div class="stats">
      <div class="stat"><strong id="total">0</strong><span>총 타격</span></div>
      <div class="stat"><strong id="combo">0</strong><span>현재 콤보</span></div>
      <div class="stat"><strong id="best">0</strong><span>최고 콤보</span></div>
    </div>
    <div class="section-title">① 도구 선택</div>
    <div class="tools">
      <button class="tool active" data-tool="주먹"><b>👊</b>주먹</button>
      <button class="tool" data-tool="손바닥"><b>🖐️</b>손바닥</button>
      <button class="tool" data-tool="빠따"><b>🏏</b>빠따</button>
      <button class="tool" data-tool="채찍"><b>〰️</b>채찍</button>
    </div>
    <div class="section-title">② 타격 부위 선택</div>
    <div class="zones">
      <button class="zone" data-zone="얼굴">😵 얼굴</button>
      <button class="zone" data-zone="몸통">💢 몸통</button>
      <button class="zone" data-zone="팔">💪 팔</button>
      <button class="zone" data-zone="다리">🦵 다리</button>
      <button class="zone" data-zone="전체">💥 전체</button>
    </div>
    <div class="section-title">③ 타격 기록</div>
    <div class="actions">
      <button class="reset" id="reset">기록 초기화</button>
      <button class="sound" id="sound">🔊 사운드 ON</button>
    </div>
    <p class="note">기록은 현재 접속한 기기의 브라우저에 저장됩니다. 친구들끼리 기록을 공유하거나 실시간 랭킹을 보려면 다음 단계에서 데이터베이스 연결이 필요해요.</p>
  </section>
</div>
</div>
<script>
// 입장 비밀번호: 친구에게 공유하기 전에 원하는 값으로 바꾸세요.
const SITE_PASSWORD = "hitme2026";

const login = document.getElementById('login');
const pass = document.getElementById('password');
const errorBox = document.getElementById('error');
function enterSite(){
  if(pass.value === SITE_PASSWORD){ login.style.display='none'; sessionStorage.setItem('hitme-unlocked','yes'); }
  else errorBox.textContent='암호가 맞지 않아요. 다시 입력해 주세요!';
}
document.getElementById('enter').addEventListener('click',enterSite);
pass.addEventListener('keydown',e=>{if(e.key==='Enter')enterSite()});
if(sessionStorage.getItem('hitme-unlocked')==='yes')login.style.display='none';

let tool='주먹', total=0, combo=0, best=0, soundOn=true, comboTimer;
const totalEl=document.getElementById('total'), comboEl=document.getElementById('combo'), bestEl=document.getElementById('best');
const character=document.getElementById('character'), stage=document.getElementById('stage');
const saved=JSON.parse(localStorage.getItem('hitme-stats')||'{}');
total=saved.total||0; best=saved.best||0; update();
function update(){totalEl.textContent=total;comboEl.textContent=combo;bestEl.textContent=best;localStorage.setItem('hitme-stats',JSON.stringify({total,best}));}
document.querySelectorAll('.tool').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.tool').forEach(b=>b.classList.remove('active'));btn.classList.add('active');tool=btn.dataset.tool;
}));
const words={주먹:['POW!','퍽!','BOOM!'],손바닥:['짝!','SMACK!','찰싹!'],빠따:['WHACK!','빠악!','쿵!'],채찍:['슉!','촥!','SWISH!']};
const icons={주먹:'👊',손바닥:'🖐️',빠따:'🏏',채찍:'〰️'};
function hit(zone){
  total++;combo++;best=Math.max(best,combo);update();
  character.classList.remove('hit');void character.offsetWidth;character.classList.add('hit');
  const word=document.createElement('div');word.className='hitword';word.textContent=words[tool][Math.floor(Math.random()*words[tool].length)];
  const rect=stage.getBoundingClientRect();word.style.left=(rect.width*.5-35+(Math.random()*70-35))+'px';word.style.top=(rect.height*.25+Math.random()*100)+'px';stage.appendChild(word);setTimeout(()=>word.remove(),700);
  if(soundOn)playSound();
  clearTimeout(comboTimer);comboTimer=setTimeout(()=>{combo=0;update()},1300);
}
document.querySelectorAll('[data-zone]').forEach(b=>b.addEventListener('click',()=>hit(b.dataset.zone)));
document.querySelectorAll('.part').forEach(p=>p.addEventListener('click',()=>hit(p.dataset.part)));
document.getElementById('reset').addEventListener('click',()=>{
  if(confirm('이 기기의 타격 기록을 모두 초기화할까요?')){total=0;combo=0;best=0;clearTimeout(comboTimer);update();}
});
document.getElementById('sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 사운드 ON':'🔇 사운드 OFF'});
function playSound(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;const ctx=new Ctx();
    const osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);
    osc.type='triangle';osc.frequency.setValueAtTime(tool==='빠따'?115:tool==='손바닥'?240:tool==='채찍'?520:170,ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(55,ctx.currentTime+.12);
    gain.gain.setValueAtTime(.16,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.14);
    osc.start();osc.stop(ctx.currentTime+.15);osc.onended=()=>ctx.close();
  }catch(e){}
}
</script>
</body>
</html>
